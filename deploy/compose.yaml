# One app instance behind a Cloudflare Tunnel. PocketBase makes the backups.
# See decision 00010 and deploy/README.md.
services:
  app:
    image: olive:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # An empty REVIEWS_ value gives the default of the app. AGENTS.md lists the
    # variables.
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?Set PB_ENCRYPTION_KEY in deploy/.env}
      # The Go runtime frees memory before the container gets to its limit.
      GOMEMLIMIT: ${APP_GOMEMLIMIT:-600MiB}
      REVIEWS_SIGN_IN_LIMIT: ${REVIEWS_SIGN_IN_LIMIT:-}
      REVIEWS_SIGN_IN_FAILURE_LIMIT: ${REVIEWS_SIGN_IN_FAILURE_LIMIT:-}
      REVIEWS_PHOTO_UPLOAD_LIMIT: ${REVIEWS_PHOTO_UPLOAD_LIMIT:-}
      REVIEWS_PLACES_URL: ${REVIEWS_PLACES_URL:-}
      REVIEWS_PLACE_SEARCH_LIMIT: ${REVIEWS_PLACE_SEARCH_LIMIT:-}
      REVIEWS_CREATE_LIMIT: ${REVIEWS_CREATE_LIMIT:-}
      REVIEWS_EDIT_LIMIT: ${REVIEWS_EDIT_LIMIT:-}
      REVIEWS_MAP_TILE_URL: ${REVIEWS_MAP_TILE_URL:-}
      REVIEWS_MAP_ATTRIBUTION: ${REVIEWS_MAP_ATTRIBUTION:-}
      REVIEWS_TIME_ZONE: ${REVIEWS_TIME_ZONE:-}
      REVIEWS_VALIDATE_REQUESTS: ${REVIEWS_VALIDATE_REQUESTS:-}
      REVIEWS_VALIDATE_RESPONSES: ${REVIEWS_VALIDATE_RESPONSES:-}
    volumes:
      - pb_data:/pb_data
    expose:
      - "8090"

  # The tunnel is the only way in. Do not publish the port of the app. A
  # client could then send its own CF-Connecting-IP.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}

volumes:
  pb_data:
