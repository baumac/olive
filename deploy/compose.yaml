# One app instance behind Caddy, with a backup service. See decision 00022
# and deploy/README.md.
services:
  app:
    image: reviews-app:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # An empty value gives the default of the app. AGENTS.md lists the variables.
    environment:
      REVIEWS_SIGN_IN_LIMIT: ${REVIEWS_SIGN_IN_LIMIT:-}
      REVIEWS_SIGN_IN_FAILURE_LIMIT: ${REVIEWS_SIGN_IN_FAILURE_LIMIT:-}
      REVIEWS_PHOTO_UPLOAD_LIMIT: ${REVIEWS_PHOTO_UPLOAD_LIMIT:-}
      REVIEWS_PLACES_URL: ${REVIEWS_PLACES_URL:-}
      REVIEWS_PLACE_SEARCH_LIMIT: ${REVIEWS_PLACE_SEARCH_LIMIT:-}
      REVIEWS_MAP_TILE_URL: ${REVIEWS_MAP_TILE_URL:-}
      REVIEWS_MAP_ATTRIBUTION: ${REVIEWS_MAP_ATTRIBUTION:-}
      REVIEWS_VALIDATE_REQUESTS: ${REVIEWS_VALIDATE_REQUESTS:-}
      REVIEWS_VALIDATE_RESPONSES: ${REVIEWS_VALIDATE_RESPONSES:-}
    volumes:
      - pb_data:/pb_data
    expose:
      - "8090"

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: reviews-app:local
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["backup"]
    command: []
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    # The service is unhealthy after a backup that failed.
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /tmp/backup-failed"]
      interval: 1m
      timeout: 5s
      start_period: 1m
    volumes:
      - pb_data:/pb_data
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  pb_data:
  caddy_data:
  caddy_config:
