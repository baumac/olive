name: Set up Go and Node.js
description: Installs the Go version of app/api/go.mod and Node.js 22, and restores the Go and npm caches. See decision 00010.
inputs:
  save-cache:
    description: Save the caches at the end of the job. Only one job of a run saves them.
    default: 'false'
runs:
  using: composite
  steps:
    # The caches of setup-go and setup-node save in each job. Seven jobs then
    # race for one cache key.
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: app/api/go.mod
        cache: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - if: inputs.save-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.npm
        key: ci-${{ runner.os }}-${{ hashFiles('app/api/go.sum', 'specs/api/sdk/server/go/go.sum', 'package-lock.json') }}
        restore-keys: ci-${{ runner.os }}-
    - if: inputs.save-cache != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.npm
        key: ci-${{ runner.os }}-${{ hashFiles('app/api/go.sum', 'specs/api/sdk/server/go/go.sum', 'package-lock.json') }}
        restore-keys: ci-${{ runner.os }}-
