# Runs the checks of AGENTS.md on each push and pull request. See decision
# 00006.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            app/sdk/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: make install-tools
      # The lint runs the generators. OpenAPI Generator runs in Docker,
      # which the runner has.
      - run: make lint
      - run: make test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: |
            app/go.sum
            app/sdk/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
        working-directory: test
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report
            test/test-results
          retention-days: 7
