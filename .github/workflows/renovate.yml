# Runs Renovate on the first day of each month. Decision 00026 explains the
# token and the settings. .github/renovate.json has the rules of the updates.
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" must be on.
name: Renovate

on:
  schedule:
    # GitHub delays the runs at the start of an hour.
    - cron: '17 4 1 * *'
  workflow_dispatch:
    inputs:
      log-level:
        description: The log level of Renovate
        type: choice
        default: info
        options: [info, debug]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Renovate pushes its branch, opens the pull request, and keeps the
    # Dependency Dashboard issue.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The checkout gets only the makefile. Renovate makes its own clone.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: make renovate
        env:
          RENOVATE_TOKEN: ${{ github.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
