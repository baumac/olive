openapi: 3.1.0
info:
  title: Reviews Public API
  version: 1.0.0
  description: |
    The Public API lets users review subjects, such as books, movies, and restaurants.

    Read operations do not require authentication.
    Create, update, and delete operations require a PocketBase auth token for a record in the `users` collection.
    A request with an invalid token gets `401 Unauthorized`, also on read operations.

    Timestamps use the PocketBase format, for example `2024-11-04 01:26:55.002Z`.
    This format is not RFC 3339.

    Request bodies with unknown or read-only properties get `400 Bad Request`.
    Property values that break a schema rule get `422 Unprocessable Content`.

servers:
  - url: /v1

tags:
  - name: subjects
    description: Things that can be reviewed.
  - name: reviews
    description: Ratings and feedback for a single subject.

paths:
  /subjects:
    post:
      operationId: createSubject
      summary: Create a subject
      tags: [subjects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The subject was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listSubjects
      summary: List subjects
      tags: [subjects]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SubjectSort'
        - $ref: '#/components/parameters/KindEq'
        - $ref: '#/components/parameters/KindIn'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedLt'
        - $ref: '#/components/parameters/CreatedLte'
        - $ref: '#/components/parameters/CreatedEq'
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedGt'
        - $ref: '#/components/parameters/UpdatedLt'
        - $ref: '#/components/parameters/UpdatedLte'
        - $ref: '#/components/parameters/UpdatedEq'
        - $ref: '#/components/parameters/UpdatedGte'
        - $ref: '#/components/parameters/UpdatedGt'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subjects/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      operationId: getSubject
      summary: Get a subject
      tags: [subjects]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateSubject
      summary: Update a subject
      description: |
        Only the creator of the subject can update it.
        `title` and `kind` can change only while the subject has no reviews.
        A value that is equal to the stored value is not a change.
      tags: [subjects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SubjectPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteSubject
      summary: Delete a subject
      description: |
        Only the creator of the subject can delete it.
        A subject that has reviews cannot be deleted.
      tags: [subjects]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The subject was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /subjects/{subjectId}/reviews:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    post:
      operationId: createReview
      summary: Create a review for a subject
      description: A user can have at most one review per subject.
      tags: [reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The review was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listReviews
      summary: List the reviews of a subject
      tags: [reviews]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReviewSort'
        - $ref: '#/components/parameters/RatingLt'
        - $ref: '#/components/parameters/RatingLte'
        - $ref: '#/components/parameters/RatingEq'
        - $ref: '#/components/parameters/RatingGte'
        - $ref: '#/components/parameters/RatingGt'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedLt'
        - $ref: '#/components/parameters/CreatedLte'
        - $ref: '#/components/parameters/CreatedEq'
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedGt'
        - $ref: '#/components/parameters/UpdatedLt'
        - $ref: '#/components/parameters/UpdatedLte'
        - $ref: '#/components/parameters/UpdatedEq'
        - $ref: '#/components/parameters/UpdatedGte'
        - $ref: '#/components/parameters/UpdatedGt'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects/{subjectId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getReview
      summary: Get a review
      tags: [reviews]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateReview
      summary: Update a review
      description: Only the creator of the review can update it.
      tags: [reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteReview
      summary: Delete a review
      description: Only the creator of the review can delete it.
      tags: [reviews]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The review was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A PocketBase auth token for a record in the `users` collection.

  headers:
    Location:
      description: The URL of the created resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'

    Limit:
      name: limit
      in: query
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: |
        The `next_cursor` value of the previous page.
        Clients must not parse or build cursor values.
        A cursor is valid only with the same filters and sort that made it.
      schema:
        type: string
        minLength: 1

    SubjectSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `title` sort ignores case only for the ASCII letters `A` to `Z`.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(title|created|updated)(,-?(title|created|updated))*$'
        default: '-created'
      example: 'title,-created'
    ReviewSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `title` sort ignores case only for the ASCII letters `A` to `Z`.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(rating|title|created|updated)(,-?(rating|title|created|updated))*$'
        default: '-created'
      example: '-rating,title'

    KindEq:
      name: kind[eq]
      in: query
      description: The subject `kind` is equal to the value.
      schema:
        type: string
    KindIn:
      name: kind[in]
      in: query
      description: The subject `kind` is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string

    TagsHas:
      name: tags[has]
      in: query
      description: The `tags` contain the tag.
      schema:
        $ref: '#/components/schemas/Tag'
    TagsHasAny:
      name: tags[has_any]
      in: query
      description: The `tags` contain at least one of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/Tag'
    TagsHasAll:
      name: tags[has_all]
      in: query
      description: The `tags` contain all of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/Tag'

    RatingLt:
      name: rating[lt]
      in: query
      schema:
        $ref: '#/components/schemas/Rating'
    RatingLte:
      name: rating[lte]
      in: query
      schema:
        $ref: '#/components/schemas/Rating'
    RatingEq:
      name: rating[eq]
      in: query
      schema:
        $ref: '#/components/schemas/Rating'
    RatingGte:
      name: rating[gte]
      in: query
      schema:
        $ref: '#/components/schemas/Rating'
    RatingGt:
      name: rating[gt]
      in: query
      schema:
        $ref: '#/components/schemas/Rating'

    CreatedLt:
      name: created[lt]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedLte:
      name: created[lte]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedEq:
      name: created[eq]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedGte:
      name: created[gte]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedGt:
      name: created[gt]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'

    UpdatedLt:
      name: updated[lt]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedLte:
      name: updated[lte]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedEq:
      name: updated[eq]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedGte:
      name: updated[gte]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedGt:
      name: updated[gt]
      in: query
      schema:
        $ref: '#/components/schemas/Timestamp'

    CreatorEq:
      name: creator[eq]
      in: query
      description: The `creator.id` is equal to the value.
      schema:
        $ref: '#/components/schemas/RecordId'
    CreatorIn:
      name: creator[in]
      in: query
      description: The `creator.id` is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RecordId'

  responses:
    BadRequest:
      description: The request is malformed, has invalid query parameters, or has unknown or read-only properties in the body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The bearer token is missing on a create, update, or delete request, or the bearer token is invalid.
      headers:
        WWW-Authenticate:
          description: The auth scheme. An invalid token adds `error="invalid_token"`.
          required: true
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The user is not the creator of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource or the subject in the path does not exist, or the review belongs to a different subject.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the current state.
        Examples are a duplicate review for a subject, a delete of a subject that has reviews,
        or a change of `title` or `kind` on a subject that has reviews.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request content type is wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request body has invalid property values.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: An error that no other response describes, such as `500 Internal Server Error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    RecordId:
      description: A PocketBase record ID.
      type: string
      pattern: '^[a-z0-9]{15}$'
      examples: [k3x9m2p7q1w8z4a]
    Timestamp:
      description: A UTC timestamp in the PocketBase format. This format is not RFC 3339.
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}Z$'
      examples: ['2024-11-04 01:26:55.002Z']
    Title:
      description: A title with at least one character that is not ASCII whitespace.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[^\t\n\v\f\r ]'
    LongText:
      type: string
      maxLength: 10000
    Rating:
      type: integer
      minimum: 1
      maximum: 5
    Tag:
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Tags:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
    SubjectKind:
      description: The kinds of subject that clients can create.
      type: string
      enum: [book, movie, restaurant]
    Creator:
      description: The public fields of a user.
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          description: The name of the user. It can be an empty string.
          type: string

    Subject:
      type: object
      required: [id, title, kind, creator, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        title:
          $ref: '#/components/schemas/Title'
        kind:
          description: |
            The kind of the subject.
            Later releases of `/v1` can add values.
            Clients must handle unknown values without failing.
          anyOf:
            - $ref: '#/components/schemas/SubjectKind'
            - type: string
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          description: The user who created the subject. It is `null` after that user is deleted.
          oneOf:
            - $ref: '#/components/schemas/Creator'
            - type: 'null'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: k3x9m2p7q1w8z4a
          title: The Great Gatsby
          kind: book
          description: A novel by F. Scott Fitzgerald
          tags: [classic, fiction]
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
          created: '2024-11-04 01:26:55.002Z'
          updated: '2024-11-04 01:26:55.002Z'
    SubjectCreate:
      type: object
      additionalProperties: false
      required: [title, kind]
      properties:
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/SubjectKind'
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
    SubjectPatch:
      description: A JSON Merge Patch. `null` clears an optional property.
      type: object
      additionalProperties: false
      properties:
        title:
          $ref: '#/components/schemas/Title'
        kind:
          $ref: '#/components/schemas/SubjectKind'
        description:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
    SubjectList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    Review:
      type: object
      required: [id, subject, rating, title, creator, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        subject:
          $ref: '#/components/schemas/RecordId'
        rating:
          $ref: '#/components/schemas/Rating'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          $ref: '#/components/schemas/Creator'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: r7d4f0h2j9l5s3v
          subject: k3x9m2p7q1w8z4a
          rating: 5
          title: Joe's Great Gatsby Review
          feedback: Great novel
          tags: [favorites]
          creator:
            id: u2g6k0m4o8q1s5w
            name: Joe
          created: '2024-11-04 01:38:00.431Z'
          updated: '2024-11-05 09:12:00.000Z'
    ReviewCreate:
      type: object
      additionalProperties: false
      required: [rating, title]
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
    ReviewPatch:
      description: A JSON Merge Patch. `null` clears an optional property.
      type: object
      additionalProperties: false
      properties:
        rating:
          $ref: '#/components/schemas/Rating'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
    ReviewList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'

    NextCursor:
      description: The cursor for the next page. It is `null` on the last page.
      oneOf:
        - type: string
        - type: 'null'

    Problem:
      description: An RFC 9457 Problem Details object.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: The invalid properties. Only validation errors have this property.
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: about:blank
          title: Unprocessable Content
          status: 422
          detail: The request body has invalid properties.
          errors:
