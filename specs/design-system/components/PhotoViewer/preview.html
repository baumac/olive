<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PhotoViewer — preview</title></head>
<body>
<div class="rv-overlay">
<div class="rv-dialog" role="dialog" aria-modal="true" aria-labelledby="pv-t" aria-describedby="pv-d" style="max-width:640px">
<button class="rv-dialog-close" aria-label="Close"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
<div class="rv-col"><h2 class="rv-dialog-title" id="pv-t">Photo 1 of 3</h2><p class="rv-dialog-desc" id="pv-d">A plate of carbonara</p></div>
<div role="img" aria-label="A plate of carbonara" style="height:200px;border-radius:var(--radius-md);background:color-mix(in oklab, var(--primary) 35%, var(--muted))"></div>
<div class="rv-row" style="justify-content:space-between"><button class="rv-btn rv-btn-outline">Previous photo</button><button class="rv-btn rv-btn-outline">Next photo</button></div>
<div class="rv-row" style="border-top:1px solid var(--border);padding-top:var(--space-4)"><button class="rv-btn rv-btn-outline">Edit description</button><button class="rv-btn rv-btn-outline">Delete photo</button></div>
</div></div>
</body>
</html>
