<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FilterBar — preview</title></head>
<body>
<div class="rv-stage">
<div class="rv-filterbar">
<label class="rv-search" style="flex:1 1 220px;max-width:320px"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span class="rv-sr">Search restaurants</span><input type="search" placeholder="Search"></label>
<button class="rv-btn rv-btn-outline rv-btn-sm"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>Filters</button>

<nav class="rv-viewswitch" aria-label="View"><a href="#" aria-current="page">List</a><a href="#">Map</a></nav>

</div>
</body>
</html>
