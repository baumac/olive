<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TagInput — preview</title></head>
<body>
<div class="rv-stage" style="max-width:420px">
<div class="rv-field"><label class="rv-label" for="t1">Tags</label>
<div class="rv-tags"><span class="rv-tag">italian<button aria-label="Remove italian"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span><span class="rv-tag">pasta<button aria-label="Remove pasta"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span><input id="t1" placeholder="Add a tag"></div>
<p class="rv-desc">Lowercase letters and numbers. Join words with a hyphen.</p></div>
<div class="rv-field"><div class="rv-tags" aria-invalid="true"><span class="rv-tag">italian<button aria-label="Remove italian"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span><input value="Wood Fired" aria-label="Tags" aria-invalid="true"></div>
<p class="rv-msg">Use lowercase and hyphens, for example wood-fired.</p></div>
</div>
</body>
</html>
