<!-- @dsCard group="Display" height=200 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RatingDisplay — preview</title></head>
<body>
<div class="rv-stage">
<p style="margin:0;display:flex;align-items:baseline;gap:24px">
<span class="rv-score" role="img" aria-label="Overall: 7.8 out of 10"><span class="rv-score-num" aria-hidden="true">7.8</span></span>
<span class="rv-score" role="img" aria-label="Overall: 9 out of 10"><span class="rv-score-num" aria-hidden="true">9</span></span>
<span class="rv-desc">size md, at the end of a row</span>
</p>
<p style="margin:0;display:flex;flex-wrap:wrap;gap:4px 16px">
<span class="rv-score" role="img" aria-label="Space: 7 out of 10"><span class="rv-score-label" aria-hidden="true">Space</span><span class="rv-score-num" aria-hidden="true" style="font-size:18px">7</span></span>
<span class="rv-score" role="img" aria-label="Service: 9 out of 10"><span class="rv-score-label" aria-hidden="true">Service</span><span class="rv-score-num" aria-hidden="true" style="font-size:18px">9</span></span>
<span class="rv-score" role="img" aria-label="Food: 8 out of 10"><span class="rv-score-label" aria-hidden="true">Food</span><span class="rv-score-num" aria-hidden="true" style="font-size:18px">8</span></span>
<span class="rv-score" role="img" aria-label="Value: 6 out of 10"><span class="rv-score-label" aria-hidden="true">Value</span><span class="rv-score-num" aria-hidden="true" style="font-size:18px">6</span></span>
</p>
<p class="rv-desc">showLabel, size sm</p>
</div>
</body>
</html>
