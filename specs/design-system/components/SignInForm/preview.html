<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SignInForm — preview</title></head>
<body>
<div class="rv-stage" style="align-items:center"><div class="rv-card rv-auth">
<div class="rv-card-header"><h2 class="rv-card-title" style="font-size:20px">Sign in</h2><p class="rv-card-desc">Sign in to write and edit reviews.</p></div>
<div class="rv-card-content rv-col" style="gap:16px">
<div class="rv-alert rv-alert-destructive" role="alert"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><p class="rv-alert-title">The email or password is not correct</p></div>
<div class="rv-field"><label class="rv-label" for="e">Email</label><input class="rv-input" id="e" type="email" autocomplete="email" value="ana@example.com"></div>
<div class="rv-field"><label class="rv-label" for="p">Password</label><input class="rv-input is-focus" id="p" type="password" autocomplete="current-password" value="••••••••"></div>
<button class="rv-btn" type="submit" style="width:100%">Sign in</button></div></div></div>
</body>
</html>
