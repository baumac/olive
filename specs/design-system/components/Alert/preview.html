<!doctype html>
<!-- @dsCard group="Status" height=280 subtitle="Info, success, danger" -->
<html>
<head><meta charset="utf-8"><title>Alert preview</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface)} .stack{display:flex;flex-direction:column;gap:16px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Sponga47, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h(S.Alert, { title: 'Backups run every night at 02:00' }, 'You can change the time in Settings.'),
    h(S.Alert, { tone: 'success', title: 'Review published' }),
    h(S.Alert, { tone: 'danger', title: 'The server did not respond' }, 'Check that the API is running, then try again.')
  ));
</script>
</body>
</html>
