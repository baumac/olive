<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Alert — preview</title></head>
<body>
<div class="rv-stage" style="max-width:480px">
<div class="rv-alert rv-alert-destructive" role="alert"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><p class="rv-alert-title">The review was not saved</p><p class="rv-alert-desc">The server did not answer. Try again in a moment.</p></div>
<div class="rv-alert rv-alert-success" role="status"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><p class="rv-alert-title">Your review is live</p><p class="rv-alert-desc">Other people can now see it on Luigi's Trattoria.</p></div>
<div class="rv-alert"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><p class="rv-alert-title">Reviews have four scores</p><p class="rv-alert-desc">Space, service, food, and price each score from 1 to 10.</p></div>
</div>
</body>
</html>
