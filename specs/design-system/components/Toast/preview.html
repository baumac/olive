<!-- @dsCard group="Feedback" height=240 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="rv-stage" style="align-items:flex-end">
<div class="rv-toast rv-toast-success" role="status"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><div><p class="rv-toast-title">Review saved</p><p class="rv-toast-desc">"Best carbonara in town" is now on Luigi's Trattoria.</p></div><button class="rv-toast-close" aria-label="Close"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="rv-toast rv-toast-error" role="alert"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><div><p class="rv-toast-title">The review was not deleted</p><p class="rv-toast-desc">Check your connection and try again.</p></div><button class="rv-toast-close" aria-label="Close"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
<div class="rv-toast" role="status"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div><p class="rv-toast-title">Signed out</p></div><button class="rv-toast-close" aria-label="Close"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
</div>
</body>
</html>
