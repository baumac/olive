<!doctype html>
<html>
<head><meta charset="utf-8"><title>Badge preview</title>
<style>body{margin:0;padding:16px;background:var(--surface)} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Sponga47, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'row' },
    h(S.Badge, null, 'Draft'),
    h(S.Badge, { tone: 'brand' }, '4 of 5'),
    h(S.Badge, { tone: 'success' }, 'Published'),
    h(S.Badge, { tone: 'danger' }, 'Flagged')
  ));
</script>
</body>
</html>
