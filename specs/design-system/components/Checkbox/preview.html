<div id="root"></div>
<script>
  var S = window.Sponga47, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'stack' },
    h(S.Checkbox, { label: 'Show my name on reviews', defaultChecked: true }),
    h(S.Checkbox, { label: 'Email me when someone replies', hint: 'At most one email a day.' }),
    h(S.Checkbox, { label: 'Allow public sharing', disabled: true })
  ));
</script>
