<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PhotoGrid — preview</title></head>
<body>
<div class="rv-stage" style="max-width:420px">
<ul aria-label="Photos of Great food" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);list-style:none;margin:0;padding:0">
<li><button aria-label="A plate of carbonara" style="display:block;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:var(--radius-md);background:color-mix(in oklab, var(--primary) 35%, var(--muted))"></button></li>
<li><button aria-label="Photo 2 of 3" class="rv-skeleton" style="display:block;width:100%;aspect-ratio:1;border:0;padding:0"></button></li>
<li><button aria-label="Photo 3 of 3" style="display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border:0;padding:0;border-radius:var(--radius-md);background:var(--muted);color:var(--muted-foreground)"><svg class="rv-icon" viewBox="0 0 24 24" aria-hidden="true" style="width:24px;height:24px"><path d="m2 2 20 20"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><path d="M13.5 13.5 6 21"/><path d="M18 12l3 3"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></svg></button></li>
</ul>
</div>
</body>
</html>
