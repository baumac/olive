<html>
<head><meta charset="utf-8"><title>Tabs preview</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../fonts.css">
<link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface)} p{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Sponga47, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(S.Tabs, {
    label: 'Review sections',
    tabs: [
      { id: 'all', label: 'All reviews', content: h('p', null, '128 reviews across 4 categories.') },
      { id: 'mine', label: 'My reviews', content: h('p', null, 'You have written 12 reviews.') },
      { id: 'drafts', label: 'Drafts', content: h('p', null, 'No drafts.') }
    ]
  }));
</script>
</body>
</html>
