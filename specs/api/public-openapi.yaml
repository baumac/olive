      summary: List the lists of a user
      description: |
        The favorites list is first. The other lists follow, the newest first.
        A user has at most 50 lists. The response has all of them.
        With `restaurant[eq]`, each list tells in `has_restaurant` if it has the restaurant.
        With `recipe[eq]`, each list tells in `has_recipe` if it has the recipe.
