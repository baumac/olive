        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRecipe
      x-rate-limit:
        key: user
        name: edit
      summary: Update a recipe
      description: |
        Only the creator of the recipe can update it.
        A recipe without a creator can be updated by each user who has a review of it.
        `name`, `ingredients`, and `steps` can change only while no other user has a review of the recipe.
        A stored `source` has the same rule. A recipe without a source can always get one.
        A value that is equal to the stored value is not a change.
        The API compares the sources without the case of the scheme and the host, the fragment, and a final `/`.
        A `source` that another recipe has causes `409 Conflict`.
        The problem then has the ID of that recipe in `recipe`.
      tags: [recipes]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The recipe properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
