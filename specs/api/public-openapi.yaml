    SpaceScore:
      description: Decoration, comfort, atmosphere, and kitchen setup.
      $ref: '#/components/schemas/Score'
    ServiceScore:
      description: Professionalism, speed, friendliness, and attentiveness of the waitstaff.
      $ref: '#/components/schemas/Score'
    FoodScore:
      description: Presentation, flavor, ingredient quality, and culinary execution.
      $ref: '#/components/schemas/Score'
    PriceScore:
      description: Value for money, and whether the final bill matches the quality provided.
      $ref: '#/components/schemas/Score'
    CleanlinessScore:
      description: Cleanliness of the dining room, the tableware, and the restrooms.
      $ref: '#/components/schemas/Score'

    ReviewCreate:
      description: The properties of a new review.
      type: object
      additionalProperties: false
      required: [space, service, food, price, cleanliness, title]
      properties:
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        cleanliness:
          $ref: '#/components/schemas/CleanlinessScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
      examples:
        - space: 7
          service: 9
          food: 8
          price: 6
          cleanliness: 8
          title: Great food, a bit expensive

    ReviewPatch:
      description: A JSON Merge Patch. `null` clears an optional property. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        cleanliness:
          $ref: '#/components/schemas/CleanlinessScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
      examples:
        - price: 7
          feedback: null

    ReviewList:
      description: A page of reviews.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: r7d4f0h2j9l5s3v
              restaurant: k3x9m2p7q1w8z4a
              restaurant_name: Luigi's Trattoria
              overall: 9
              space: 8
              service: 10
              food: 10
              price: 9
              cleanliness: 8
              title: Best carbonara in town
              creator:
                id: u2g6k0m4o8q1s5w
                name: Joe
              photos: []
              created: '2024-11-04T01:38:00.431Z'
              updated: '2024-11-05T09:12:00.000Z'
            - id: r1b8c5e2g9i6k3m
              restaurant: k3x9m2p7q1w8z4a
              restaurant_name: Luigi's Trattoria
              overall: 7.6
              space: 7
              service: 9
              food: 8
              price: 6
              cleanliness: 8
              title: Great food, a bit expensive
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
              photos: []
              created: '2024-11-06T19:02:11.120Z'
              updated: '2024-11-06T19:02:11.120Z'
          next_cursor: null

    Photo:
      description: A photo of a review. The image of a photo never changes.
      type: object
      required: [id, alt, width, height, urls, created]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        alt:
          description: A text that describes the photo for screen readers. It is `null` without a description.
          oneOf:
            - $ref: '#/components/schemas/AltText'
            - type: 'null'
        width:
          description: The width of the `full` image in pixels.
          type: integer
          minimum: 1
          maximum: 2048
        height:
          description: The height of the `full` image in pixels.
          type: integer
          minimum: 1
          maximum: 2048
        urls:
          $ref: '#/components/schemas/PhotoUrls'
        created:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: p4h7j1l5n9q2s6v
          alt: A plate of carbonara on a wooden table
          width: 1536
          height: 2048
          urls:
            full: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/full
            thumb: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/thumb
          created: '2024-11-06T19:04:30.811Z'
    RestaurantPhoto:
      description: A photo of a review of a restaurant. It has the properties of `Photo`, the review, and the creator of the review.
      allOf:
        - $ref: '#/components/schemas/Photo'
        - type: object
          required: [review, creator]
          properties:
            review:
              $ref: '#/components/schemas/RecordId'
            creator:
              $ref: '#/components/schemas/Creator'
      examples:
        - id: p4h7j1l5n9q2s6v
          alt: A plate of carbonara on a wooden table
          width: 1536
          height: 2048
          urls:
            full: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/full
            thumb: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/thumb
          created: '2024-11-06T19:04:30.811Z'
          review: r1b8c5e2g9i6k3m
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
    RestaurantPhotoList:
      description: A page of the photos of a restaurant.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantPhoto'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: p4h7j1l5n9q2s6v
              alt: null
              width: 2048
              height: 1536
              urls:
                full: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/full
                thumb: /v1/restaurants/k3x9m2p7q1w8z4a/reviews/r1b8c5e2g9i6k3m/photos/p4h7j1l5n9q2s6v/thumb
              created: '2024-11-06T19:04:30.811Z'
              review: r1b8c5e2g9i6k3m
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
          next_cursor: null
    PhotoUrls:
      description: The paths of the image files on the origin of the API. Clients use them as given.
      type: object
      required: [full, thumb]
      properties:
        full:
          description: The image with at most 2048 pixels on its long side.
          type: string
          format: uri-reference
        thumb:
          description: The image with at most 480 pixels on its long side.
          type: string
          format: uri-reference
    AltText:
      description: |
        A text with at least one character that is not ASCII whitespace.
        Control characters, direction marks and overrides, and invisible characters such as zero-width spaces cause `422`.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^ *[^ \x00-\x1F\x7F-\x9F\u00AD\u061C\u115F\u1160\u180E\u200B\u200E\u200F\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0\uFFF9-\uFFFB][^\x00-\x1F\x7F-\x9F\u00AD\u061C\u115F\u1160\u180E\u200B\u200E\u200F\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0\uFFF9-\uFFFB]*$'
      x-pattern-message: must have a character that is not whitespace, and no control, direction, or invisible characters
    PhotoPatch:
      description: A JSON Merge Patch. `null` clears the alt text. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        alt:
          oneOf:
            - $ref: '#/components/schemas/AltText'
            - type: 'null'
      examples:
        - alt: A plate of carbonara on a wooden table
    ImageUpload:
      description: The bytes of a JPEG, PNG, or WebP image.
      type: string
      format: binary
    ImageFile:
      description: The bytes of a JPEG image.
      type: string
      format: binary

    NextCursor:
      description: The cursor for the next page. It is `null` on the last page.
      oneOf:
        - type: string
        - type: 'null'

    Problem:
      description: An RFC 9457 Problem Details object.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          description: |
            A fixed value for a reason that a client must tell apart from others.
            `not_approved` is the `403` of a user that no superuser approved.
          type: string
          enum: [not_approved]
        property:
          description: |
            The request property that causes a conflict, such as `name` or `location`.
            Only a conflict of one property has it.
          type: string
        restaurant:
          description: The ID of the restaurant that has the `location.place_id` of the request. Only this conflict has the property.
          type: string
          $ref: '#/components/schemas/RecordId'
        errors:
          description: The invalid properties. Only validation errors have this property.
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: about:blank
          title: Unprocessable Content
          status: 422
          detail: The request body has invalid properties.
          errors:
            - property: food
              message: must be between 1 and 10
    ValidationError:
      description: One invalid property of a request body.
      type: object
      required: [property, message]
      properties:
        property:
          description: The invalid property. An array item uses a zero-based index, for example `tags[2]`.
          type: string
        message:
          type: string

    Email:
      description: An email address.
      type: string
      format: email
      maxLength: 255
      examples: [ana@example.com]
    Password:
      description: |
        A password of 8 to 71 characters.
        Its UTF-8 encoding must be at most 72 bytes.
        A longer password causes `422 Unprocessable Content`.
      type: string
      format: password
      minLength: 8
      maxLength: 71
      examples: [correct-horse-battery]

    User:
      description: |
        The signed in user.
        Only the user of the auth token gets this object.
        Other users see the user as a `Creator`.
      type: object
      required: [id, email, name, approved, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/Name'
        approved:
          description: |
            `true` after a superuser approved the user.
            A user who is not approved can sign in, sign out, and read.
            All other operations that need a token give `403 Forbidden`.
            Other people cannot see the reviewer profile and the lists of such a user. They get `404`.
          type: boolean
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: u5n1c8r3t6y0b2e
          email: ana@example.com
          name: Ana
          approved: true
          created: '2024-11-01T08:12:40.517Z'
          updated: '2024-11-01T08:12:40.517Z'
    UserCreate:
      description: The properties of a new user.
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          $ref: '#/components/schemas/Name'
      examples:
        - email: ana@example.com
          password: correct-horse-battery
          name: Ana
    Credentials:
      description: The email and password to sign in.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: The email address of the user.
          type: string
          format: email
        password:
          description: The password of the user.
          type: string
          format: password
      examples:
        - email: ana@example.com
          password: correct-horse-battery
    AuthToken:
      description: An auth token and the user that it belongs to.
      type: object
      required: [expires, user]
      properties:
        token:
          description: |
            The auth token.
            Send it in the `Authorization` header as a bearer token.
            Clients must not parse it.
            A response that sets the `reviews_session` cookie has no `token`.
          type: string
          examples: [eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl]
        expires:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
      examples:
        - token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl
          expires: '2024-11-08T08:12:40.517Z'
          user:
            id: u5n1c8r3t6y0b2e
            email: ana@example.com
            name: Ana
            approved: true
            created: '2024-11-01T08:12:40.517Z'
            updated: '2024-11-01T08:12:40.517Z'
