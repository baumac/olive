    PhotoUrls:
      description: The paths of the image files on the origin of the API. Clients use them as given.
      type: object
      required: [full, thumb]
      properties:
        full:
          description: The image with at most 2048 pixels on its long side.
          type: string
          format: uri-reference
        thumb:
          description: The image with at most 480 pixels on its long side.
          type: string
          format: uri-reference
    AltText:
      description: |
        A text with at least one character that is not ASCII whitespace.
        The API removes the ASCII spaces at the start and the end.
        Control characters, direction marks and overrides, and invisible characters such as zero-width spaces cause `422`.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^ *[^ \x00-\x1F\x7F-\x9F\u00AD\u061C\u115F\u1160\u180E\u200B\u200E\u200F\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0\uFFF9-\uFFFB][^\x00-\x1F\x7F-\x9F\u00AD\u061C\u115F\u1160\u180E\u200B\u200E\u200F\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0\uFFF9-\uFFFB]*$'
      x-pattern-message: must have a character that is not whitespace, and no control, direction, or invisible characters
      x-trim: true
    PhotoPatch:
      description: A JSON Merge Patch. `null` clears the alt text. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        alt:
          oneOf:
            - $ref: '#/components/schemas/AltText'
            - type: 'null'
      examples:
        - alt: A plate of carbonara on a wooden table
    ImageUpload:
      description: The bytes of a JPEG, PNG, or WebP image.
      type: string
      format: binary
    ImageFile:
      description: The bytes of a JPEG image.
      type: string
      format: binary

    NextCursor:
      description: The cursor for the next page. It is `null` on the last page.
      oneOf:
        - type: string
        - type: 'null'

    Problem:
      description: An RFC 9457 Problem Details object.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          description: |
            A fixed value for a reason that a client must tell apart from others.
            Each `403` and each `409` has it. The `Forbidden` and `Conflict` responses tell their values.
            `not_approved` is the `403` of a user that no superuser approved.
            `email_not_confirmed` is the `403` of a sign in before the user confirmed the email address.
            `wrong_password_limit` is the `429` of an email address or a confirmation with too many wrong passwords.
          type: string
          enum:
            - not_approved
            - email_not_confirmed
            - wrong_password_limit
            - not_creator
            - favorites_list
            - other_reviews
            - place_taken
            - photo_limit
            - list_name_taken
            - list_limit
            - list_restaurant_limit
            - source_taken
            - list_recipe_limit
        property:
          description: |
            The request property that causes a conflict, such as `name`, `location`, or `source`.
            Only a conflict of one property has it.
          type: string
        restaurant:
          description: The ID of the restaurant that has the `location.place_id` of the request. Only this conflict has the property.
          type: string
          $ref: '#/components/schemas/RecordId'
        recipe:
          description: The ID of the recipe that has the `source` of the request. Only this conflict has the property.
          type: string
          $ref: '#/components/schemas/RecordId'
        errors:
          description: The invalid properties. Only validation errors have this property.
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: about:blank
          title: Unprocessable Content
          status: 422
          detail: The request body has invalid properties.
          errors:
            - property: food
              message: must be between 1 and 10
    ValidationError:
      description: One invalid property of a request body.
      type: object
      required: [property, message]
      properties:
        property:
          description: The invalid property. An array item uses a zero-based index, for example `tags[2]`.
          type: string
        message:
          type: string

    Email:
      description: An email address.
      type: string
      format: email
      maxLength: 255
      examples: [ana@example.com]
    Password:
      description: |
        A password of 8 to 71 characters.
        Its UTF-8 encoding must be at most 72 bytes.
        A longer password causes `422 Unprocessable Content`.
      type: string
      format: password
      minLength: 8
      maxLength: 71
      examples: [correct-horse-battery]

    User:
      description: |
        The signed in user.
        Only the user of the auth token gets this object.
        Other users see the user as a `Creator`.
      type: object
      required: [id, email, name, approved, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/Name'
        approved:
          description: |
            `true` after a superuser approved the user.
            A user who is not approved can sign in, sign out, read, and change or delete the account.
            All other operations that need a token give `403 Forbidden`.
            Other people cannot see the reviewer profile and the lists of such a user. They get `404`.
          type: boolean
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: u5n1c8r3t6y0b2e
          email: ana@example.com
          name: Ana
          approved: true
          created: '2024-11-01T08:12:40.517Z'
          updated: '2024-11-01T08:12:40.517Z'
    UserCreate:
      description: The properties of a new user.
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          $ref: '#/components/schemas/Name'
      examples:
        - email: ana@example.com
          password: correct-horse-battery
          name: Ana
    EmailConfirmation:
      description: The token of a confirmation link and the password of the user.
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: '#/components/schemas/EmailToken'
        password:
          description: The password of the user. It is the `password` of the last sign up with this email address.
          type: string
          format: password
          maxLength: 255
      examples:
        - token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl
          password: correct-horse-battery
    EmailToken:
      description: |
        The token of a link in an email. The link has it after `#token=`.
        A token that is not valid or is expired causes `422`.
      type: string
      minLength: 1
      maxLength: 2000
      examples: [eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl]
    PasswordResetRequest:
      description: The email address that gets a password reset link.
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
      examples:
        - email: ana@example.com
    PasswordReset:
      description: The token of a password reset link and the new password.
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          $ref: '#/components/schemas/EmailToken'
        password:
          $ref: '#/components/schemas/Password'
    UserPatch:
      description: A JSON Merge Patch. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
      examples:
        - name: Ana Maria
    PasswordChange:
      description: The current password and the new password of the user.
      type: object
      additionalProperties: false
      required: [current_password, password]
      properties:
        current_password:
          description: The password that the user has now.
          type: string
          format: password
          maxLength: 255
        password:
          $ref: '#/components/schemas/Password'
      examples:
        - current_password: correct-horse-battery
          password: better-horse-battery
    UserDelete:
      description: The password of the user. It confirms the delete.
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          description: The password of the user.
          type: string
          format: password
          maxLength: 255
      examples:
        - password: correct-horse-battery
    Credentials:
      description: The email and password to sign in.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: The email address of the user.
          type: string
          format: email
          maxLength: 255
        password:
          description: The password of the user.
          type: string
          format: password
          maxLength: 255
      examples:
        - email: ana@example.com
          password: correct-horse-battery
    AuthToken:
      description: An auth token and the user that it belongs to.
      type: object
      required: [expires, user]
      properties:
        token:
          description: |
            The auth token.
            Send it in the `Authorization` header as a bearer token.
            Clients must not parse it.
            A response that sets the `reviews_session` cookie has no `token`.
          type: string
          examples: [eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl]
        expires:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
      examples:
        - token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl
          expires: '2024-11-08T08:12:40.517Z'
          user:
            id: u5n1c8r3t6y0b2e
            email: ana@example.com
            name: Ana
            approved: true
            created: '2024-11-01T08:12:40.517Z'
            updated: '2024-11-01T08:12:40.517Z'
