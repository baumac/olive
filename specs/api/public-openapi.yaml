      summary: Add a photo to a review
      description: |
        Only the creator of the review can add a photo. A review has at most 5 photos.
        The body is one JPEG, PNG, or WebP image of at most 10 MB and at most 25 megapixels.
        The API turns the image upright, makes it smaller, and stores it as JPEG without metadata.
        Set the alt text with `updateRestaurantReviewPhoto`.
