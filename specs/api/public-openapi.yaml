      - $ref: '#/components/parameters/RecipeId'
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: addRecipeReviewPhoto
      x-rate-limit:
        key: user
        name: photo-upload
      summary: Add a photo to a review of a recipe
      description: |
        The same rules as `addRestaurantReviewPhoto`.
        Only the creator of the review can add a photo. A review has at most 5 photos.
        Set the alt text with `updateRecipeReviewPhoto`.
      tags: [recipes]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: |
          The bytes of the image.
          The `Content-Type` is `image/jpeg`, `image/png`, or `image/webp`. Other types get `415`.
        required: true
        content:
          image/*:
            schema:
              $ref: '#/components/schemas/ImageUpload'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The photo was added.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
