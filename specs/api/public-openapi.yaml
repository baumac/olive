      - $ref: '#/components/parameters/ReviewId'
      - $ref: '#/components/parameters/PhotoId'
      - $ref: '#/components/parameters/PhotoVariant'
    get:
      operationId: getRestaurantReviewPhotoFile
      summary: Get the image file of a photo
      description: |
        Clients use the `urls` of the photo and do not build this path.
        The file never changes, so clients can cache it for a long time.
        The operation supports `HEAD`, `If-None-Match`, and `Range`.
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The image file.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PhotoCacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Content-Security-Policy:
              $ref: '#/components/headers/PhotoContentSecurityPolicy'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/ImageFile'
        '206':
          description: A range of the image file.
          headers:
            Content-Range:
              description: The range of the file in the body.
              required: true
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            image/jpeg:
              schema:
                $ref: '#/components/schemas/ImageFile'
        '304':
          description: The file did not change since the version of `If-None-Match`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: The range of the `Range` header is not in the file.
          headers:
            Content-Range:
              description: The size of the file, such as `bytes */48213`.
              required: true
              schema:
                type: string

