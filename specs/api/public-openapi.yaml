    delete:
      operationId: deleteRecipe
      x-rate-limit:
        key: user
        name: edit
      summary: Delete a recipe
      description: |
        Only the creator of the recipe can delete it.
        A recipe without a creator can be deleted by each user who has a review of it.
        A recipe that has a review of another user cannot be deleted.
        The review of the user is deleted with the recipe.
      tags: [recipes]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The recipe was deleted.
