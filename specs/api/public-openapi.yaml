openapi: 3.1.0
info:
  title: Reviews Public API
  version: 1.0.0
  description: |
    The Public API lets users sign up, sign in, and review restaurants.

    Sign up and sign in do not require authentication.
    They return an auth token.
    Read operations do not require authentication.
    Create, update, and delete operations of restaurants and reviews require an auth token.
    A request with an invalid token gets `401 Unauthorized`, also on read operations.

    Timestamps are in UTC with millisecond precision, for example `2024-11-04 01:26:55.002Z`.
    This format is not RFC 3339.

    Request bodies with unknown or read-only properties get `400 Bad Request`.
    Property values that break a schema rule get `422 Unprocessable Content`.

servers:
  - url: /v1

tags:
  - name: users
    description: Sign up, sign in, and refresh the auth token of a user.
  - name: restaurants
    description: Restaurants and their reviews.

paths:
  /users:
    post:
      operationId: signUp
      summary: Sign up a user
      description: |
        Creates a user and signs the user in.
        The response contains an auth token for the new user.
        The API ignores the `Authorization` header on this operation.
      tags: [users]
      security:
        - {}
      requestBody:
        description: The new user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/tokens:
    post:
      operationId: signIn
      summary: Sign in a user with email and password
      description: The API ignores the `Authorization` header on this operation.
      tags: [users]
      security:
        - {}
      requestBody:
        description: The email and password of the user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The user signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/tokens/refresh:
    post:
      operationId: refreshToken
      summary: Refresh the auth token of a user
      description: |
        Returns a new auth token for the user of the current token.
        The current token must be valid and not expired.
        Clients also use this operation to check a stored token.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The new auth token and the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants:
    post:
      operationId: createRestaurant
      summary: Create a restaurant
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The restaurant to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The restaurant was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listRestaurants
      summary: List restaurants
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RestaurantSort'
        - $ref: '#/components/parameters/RestaurantSearch'
        - $ref: '#/components/parameters/OverallFilter'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedFilter'
        - $ref: '#/components/parameters/UpdatedFilter'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of restaurants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      operationId: getRestaurant
      summary: Get a restaurant
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRestaurant
      summary: Update a restaurant
      description: |
        Only the creator of the restaurant can update it.
        `name` can change only while the restaurant has no reviews.
        A value that is equal to the stored value is not a change.
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The restaurant properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RestaurantPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteRestaurant
      summary: Delete a restaurant
      description: |
        Only the creator of the restaurant can delete it.
        A restaurant that has reviews cannot be deleted.
      tags: [restaurants]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The restaurant was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /restaurants/{restaurantId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      operationId: createReview
      summary: Create a review for a restaurant
      description: A user can have at most one review per restaurant.
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The review to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The review was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listReviews
      summary: List the reviews of a restaurant
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReviewSort'
        - $ref: '#/components/parameters/ReviewSearch'
        - $ref: '#/components/parameters/SpaceFilter'
        - $ref: '#/components/parameters/ServiceFilter'
        - $ref: '#/components/parameters/FoodFilter'
        - $ref: '#/components/parameters/PriceFilter'
        - $ref: '#/components/parameters/CleanlinessFilter'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedFilter'
        - $ref: '#/components/parameters/UpdatedFilter'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reviews:
    get:
      operationId: listAllReviews
      summary: List the reviews of all restaurants
      description: |
        The same filters, sorts, and pages as `listReviews`, for the reviews of all restaurants.
        `restaurant[eq]` and `restaurant[in]` select restaurants. `creator[eq]` gives the reviews of one user.
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReviewSort'
        - $ref: '#/components/parameters/ReviewSearch'
        - $ref: '#/components/parameters/RestaurantEq'
        - $ref: '#/components/parameters/RestaurantIn'
        - $ref: '#/components/parameters/SpaceFilter'
        - $ref: '#/components/parameters/ServiceFilter'
        - $ref: '#/components/parameters/FoodFilter'
        - $ref: '#/components/parameters/PriceFilter'
        - $ref: '#/components/parameters/CleanlinessFilter'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedFilter'
        - $ref: '#/components/parameters/UpdatedFilter'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants/{restaurantId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getReview
      summary: Get a review
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateReview
      summary: Update a review
      description: |
        Only the creator of the review can update it.
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The review properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteReview
      summary: Delete a review
      description: Only the creator of the review can delete it.
      tags: [restaurants]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The review was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An auth token from `signUp`, `signIn`, or `refreshToken`.

  headers:
    Location:
      description: The URL of the created resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      description: The ID of the restaurant.
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'
    ReviewId:
      name: reviewId
      in: path
      description: The ID of the review.
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'

    Limit:
      name: limit
      in: query
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: |
        The `next_cursor` value of the previous page.
        Clients must not parse or build cursor values.
        A cursor is valid only with the same filters and sort that made it.
      schema:
        type: string
        minLength: 1

    RestaurantSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `name` sort ignores case only for the ASCII letters `A` to `Z`.
        The `overall` sort uses `rating.overall`. It puts restaurants without reviews last in both directions.
        The `relevance` sort puts the best matches of `search` first. It needs `search`.
        With `search`, the default sort is `relevance`.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(name|overall|relevance|created|updated)(,-?(name|overall|relevance|created|updated))*$'
        default: '-created'
      example: 'name,-created'
    ReviewSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `title` sort ignores case only for the ASCII letters `A` to `Z`.
        The `relevance` sort puts the best matches of `search` first. It needs `search`.
        With `search`, the default sort is `relevance`.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(space|service|food|price|cleanliness|relevance|title|created|updated)(,-?(space|service|food|price|cleanliness|relevance|title|created|updated))*$'
        default: '-created'
      example: '-food,title'

    RestaurantSearch:
      name: search
      in: query
      description: |
        Full-text search in `name`, `description`, and `tags`.
        A restaurant matches when it has all words of the search. A word also matches longer words that start with it.
        The search ignores case and accents. `Cafe` matches `Café`.
        Matches in `name` count most for the `relevance` sort, then `tags`, then `description`.
        A search without a letter or a digit causes `400 Bad Request`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: italian pasta
    ReviewSearch:
      name: search
      in: query
      description: |
        Full-text search in `title`, `feedback`, `tags`, and `restaurant_name`.
        A review matches when it has all words of the search. A word also matches longer words that start with it.
        The search ignores case and accents. `Cafe` matches `Café`.
        Matches in `title` count most for the `relevance` sort, then `tags`, then `restaurant_name`, then `feedback`.
        A search without a letter or a digit causes `400 Bad Request`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: carbonara
    TagsHas:
      name: tags[has]
      in: query
      description: The `tags` contain the tag.
      schema:
        $ref: '#/components/schemas/Tag'
    TagsHasAny:
      name: tags[has_any]
      in: query
      description: The `tags` contain at least one of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          $ref: '#/components/schemas/Tag'
        examples: [[italian, pasta]]
    TagsHasAll:
      name: tags[has_all]
      in: query
      description: The `tags` contain all of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          $ref: '#/components/schemas/Tag'
        examples: [[italian, pasta]]

    SpaceFilter:
      name: space
      in: query
      description: Compares the `space` score. Each key is an operator, for example `space[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ScoreRange'
      example: {gte: 7}

    ServiceFilter:
      name: service
      in: query
      description: Compares the `service` score. Each key is an operator, for example `service[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ScoreRange'
      example: {gte: 7}

    FoodFilter:
      name: food
      in: query
      description: Compares the `food` score. Each key is an operator, for example `food[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ScoreRange'
      example: {gte: 7}

    PriceFilter:
      name: price
      in: query
      description: Compares the `price` score. Each key is an operator, for example `price[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ScoreRange'
      example: {gte: 7}

    CleanlinessFilter:
      name: cleanliness
      in: query
      description: Compares the `cleanliness` score. Each key is an operator, for example `cleanliness[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/ScoreRange'
      example: {gte: 7}

    OverallFilter:
      name: overall
      in: query
      description: |
        Compares `rating.overall`, the rounded value of the response.
        Each key is an operator, for example `overall[gte]=`.
        A restaurant without reviews matches no `overall` filter.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/AverageRange'
      example: {gte: 7.5}

    CreatedFilter:
      name: created
      in: query
      description: Compares the `created` timestamp. Each key is an operator, for example `created[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/TimestampRange'
      example: {gte: '2024-11-01 00:00:00.000Z'}

    UpdatedFilter:
      name: updated
      in: query
      description: Compares the `updated` timestamp. Each key is an operator, for example `updated[gte]=`.
      style: deepObject
      explode: true
      schema:
        $ref: '#/components/schemas/TimestampRange'
      example: {gte: '2024-11-01 00:00:00.000Z'}

    CreatorEq:
      name: creator[eq]
      in: query
      description: The `creator.id` is equal to the value.
      schema:
        $ref: '#/components/schemas/RecordId'
    CreatorIn:
      name: creator[in]
      in: query
      description: The `creator.id` is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/components/schemas/RecordId'
        examples: [[u5n1c8r3t6y0b2e, u2g6k0m4o8q1s5w]]
    RestaurantEq:
      name: restaurant[eq]
      in: query
      description: The `restaurant` of the review is equal to the value.
      schema:
        $ref: '#/components/schemas/RecordId'
    RestaurantIn:
      name: restaurant[in]
      in: query
      description: The `restaurant` of the review is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        items:
          $ref: '#/components/schemas/RecordId'
        examples: [[k3x9m2p7q1w8z4a, x7b2n9m4q1w8z3c]]

  responses:
    BadRequest:
      description: |
        The request is malformed, has invalid query parameters, or has unknown or read-only properties in the body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: |
        The bearer token is missing on a request that requires it, or the bearer token is invalid or expired.
        `refreshToken`, create, update, and delete operations require a bearer token.
      headers:
        WWW-Authenticate:
          description: The auth scheme. An invalid token adds `error="invalid_token"`.
          required: true
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The user is not the creator of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource or the restaurant in the path does not exist, or the review belongs to a different restaurant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the current state.
        Examples are a sign up with an email that another user has, a duplicate review for a restaurant,
        a delete of a restaurant that has reviews, or a change of `name` on a restaurant that has reviews.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request content type is wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request body has invalid property values.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: An error that no other response describes, such as `500 Internal Server Error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InvalidCredentials:
      description: The email and password do not match a user.
      headers:
        WWW-Authenticate:
          description: The auth scheme of the Public API.
          required: true
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: The email or password is not correct.
    TooManyRequests:
      description: The client sent too many sign up or sign in requests in a short time.
      headers:
        Retry-After:
          description: The number of seconds to wait before the next request.
          required: true
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    RecordId:
      description: A record ID of 15 characters.
      type: string
      pattern: '^[a-z0-9]{15}$'
      examples: [k3x9m2p7q1w8z4a]
    Timestamp:
      description: A UTC timestamp with millisecond precision. This format is not RFC 3339.
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}Z$'
      examples: ['2024-11-04 01:26:55.002Z']
    Name:
      description: |
        A name with at least one character that is not ASCII whitespace.
        Control characters, direction marks and overrides, and zero-width spaces cause `422`.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[^\t\n\v\f\r ]'
    Title:
      description: |
        A title with at least one character that is not ASCII whitespace.
        Control characters, direction marks and overrides, and zero-width spaces cause `422`.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[^\t\n\v\f\r ]'
    LongText:
      description: |
        A text of at most 10,000 characters.
        Line breaks and tabs are allowed. Other control characters, direction marks and overrides, and zero-width spaces cause `422`.
      type: string
      maxLength: 10000
    Score:
      description: The score of one category of a review.
      type: integer
      minimum: 1
      maximum: 10
    Tag:
      description: A lowercase tag. Words are separated by single hyphens.
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Tags:
      description: Unique tags.
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
      examples: [[italian, pasta]]
    Creator:
      description: The public fields of a user.
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          $ref: '#/components/schemas/Name'

    ScoreRange:
      description: Comparisons for a score. All comparisons must match.
      type: object
      additionalProperties: false
      properties:
        lt:
          $ref: '#/components/schemas/Score'
        lte:
          $ref: '#/components/schemas/Score'
        eq:
          $ref: '#/components/schemas/Score'
        gte:
          $ref: '#/components/schemas/Score'
        gt:
          $ref: '#/components/schemas/Score'
    AverageRange:
      description: Comparisons for an average score. All comparisons must match.
      type: object
      additionalProperties: false
      properties:
        lt:
          $ref: '#/components/schemas/AverageScore'
        lte:
          $ref: '#/components/schemas/AverageScore'
        eq:
          $ref: '#/components/schemas/AverageScore'
        gte:
          $ref: '#/components/schemas/AverageScore'
        gt:
          $ref: '#/components/schemas/AverageScore'
    TimestampRange:
      description: Comparisons for a timestamp. All comparisons must match.
      type: object
      additionalProperties: false
      properties:
        lt:
          $ref: '#/components/schemas/Timestamp'
        lte:
          $ref: '#/components/schemas/Timestamp'
        eq:
          $ref: '#/components/schemas/Timestamp'
        gte:
          $ref: '#/components/schemas/Timestamp'
        gt:
          $ref: '#/components/schemas/Timestamp'

    Restaurant:
      description: A restaurant that can be reviewed.
      type: object
      required: [id, name, creator, review_count, rating, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          description: The user who created the restaurant. It is `null` after that user is deleted.
          oneOf:
            - $ref: '#/components/schemas/Creator'
            - type: 'null'
        review_count:
          description: The number of reviews of the restaurant.
          type: integer
          minimum: 0
        rating:
          description: The average scores of the reviews. It is `null` for a restaurant without reviews.
          oneOf:
            - $ref: '#/components/schemas/RestaurantRating'
            - type: 'null'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: k3x9m2p7q1w8z4a
          name: Luigi's Trattoria
          description: A family-run Italian restaurant
          tags: [italian, pasta]
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
          review_count: 2
          rating:
            overall: 7.6
            space: 7.5
            service: 8.5
            food: 9
            price: 5.5
            cleanliness: 7.5
          created: '2024-11-04 01:26:55.002Z'
          updated: '2024-11-04 01:26:55.002Z'
    RestaurantRating:
      description: |
        The average of each score over the reviews of a restaurant.
        `overall` is the average of the five averages.
        The API rounds each value to one decimal.
      type: object
      required: [overall, space, service, food, price, cleanliness]
      properties:
        overall:
          $ref: '#/components/schemas/AverageScore'
        space:
          $ref: '#/components/schemas/AverageScore'
        service:
          $ref: '#/components/schemas/AverageScore'
        food:
          $ref: '#/components/schemas/AverageScore'
        price:
          $ref: '#/components/schemas/AverageScore'
        cleanliness:
          $ref: '#/components/schemas/AverageScore'
    AverageScore:
      description: An average score from 1 to 10 with one decimal.
      type: number
      format: double
      minimum: 1
      maximum: 10
      examples: [7.6]
    RestaurantCreate:
      description: The properties of a new restaurant.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
      examples:
        - name: Luigi's Trattoria
          description: A family-run Italian restaurant
          tags: [italian, pasta]
    RestaurantPatch:
      description: A JSON Merge Patch. `null` clears an optional property. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
      examples:
        - description: A family-run Italian restaurant since 1987
          tags: null
    RestaurantList:
      description: A page of restaurants.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: k3x9m2p7q1w8z4a
              name: Luigi's Trattoria
              description: A family-run Italian restaurant
              tags: [italian, pasta]
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
              review_count: 0
              rating: null
              created: '2024-11-04 01:26:55.002Z'
              updated: '2024-11-04 01:26:55.002Z'
          next_cursor: c2Fk9xQe7LmT2vBn

    Review:
      description: A review of a restaurant. It scores the space, service, food, price, and cleanliness.
      type: object
      required: [id, restaurant, restaurant_name, space, service, food, price, cleanliness, title, creator, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        restaurant:
          $ref: '#/components/schemas/RecordId'
        restaurant_name:
          description: |
            The `name` of the reviewed restaurant.
            The name of a restaurant with reviews cannot change, so this value stays correct.
          type: string
          $ref: '#/components/schemas/Name'
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        cleanliness:
          $ref: '#/components/schemas/CleanlinessScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          $ref: '#/components/schemas/Creator'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: r1b8c5e2g9i6k3m
          restaurant: k3x9m2p7q1w8z4a
          restaurant_name: Luigi's Trattoria
          space: 7
          service: 9
          food: 8
          price: 6
          cleanliness: 8
          title: Great food, a bit expensive
          feedback: Friendly staff and great pasta
          tags: [date-night]
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
          created: '2024-11-06 19:02:11.120Z'
          updated: '2024-11-07 09:12:00.000Z'
    SpaceScore:
      description: Decoration, comfort, atmosphere, and kitchen setup.
      $ref: '#/components/schemas/Score'
    ServiceScore:
      description: Professionalism, speed, friendliness, and attentiveness of the waitstaff.
      $ref: '#/components/schemas/Score'
    FoodScore:
      description: Presentation, flavor, ingredient quality, and culinary execution.
      $ref: '#/components/schemas/Score'
    PriceScore:
      description: Value for money, and whether the final bill matches the quality provided.
      $ref: '#/components/schemas/Score'
    CleanlinessScore:
      description: Cleanliness of the dining room, the tableware, and the restrooms.
      $ref: '#/components/schemas/Score'

    ReviewCreate:
      description: The properties of a new review.
      type: object
      additionalProperties: false
      required: [space, service, food, price, cleanliness, title]
      properties:
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        cleanliness:
          $ref: '#/components/schemas/CleanlinessScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
      examples:
        - space: 7
          service: 9
          food: 8
          price: 6
          cleanliness: 8
          title: Great food, a bit expensive

    ReviewPatch:
      description: A JSON Merge Patch. `null` clears an optional property. An empty patch changes nothing.
      type: object
      additionalProperties: false
      properties:
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        cleanliness:
          $ref: '#/components/schemas/CleanlinessScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
      examples:
        - price: 7
          feedback: null

    ReviewList:
      description: A page of reviews.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: r7d4f0h2j9l5s3v
              restaurant: k3x9m2p7q1w8z4a
              restaurant_name: Luigi's Trattoria
              space: 8
              service: 10
              food: 10
              price: 9
              cleanliness: 8
              title: Best carbonara in town
              creator:
                id: u2g6k0m4o8q1s5w
                name: Joe
              created: '2024-11-04 01:38:00.431Z'
              updated: '2024-11-05 09:12:00.000Z'
            - id: r1b8c5e2g9i6k3m
              restaurant: k3x9m2p7q1w8z4a
              restaurant_name: Luigi's Trattoria
              space: 7
              service: 9
              food: 8
              price: 6
              cleanliness: 8
              title: Great food, a bit expensive
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
              created: '2024-11-06 19:02:11.120Z'
              updated: '2024-11-06 19:02:11.120Z'
          next_cursor: null

    NextCursor:
      description: The cursor for the next page. It is `null` on the last page.
      oneOf:
        - type: string
        - type: 'null'

    Problem:
      description: An RFC 9457 Problem Details object.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: The invalid properties. Only validation errors have this property.
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: about:blank
          title: Unprocessable Content
          status: 422
          detail: The request body has invalid properties.
          errors:
            - property: food
              message: must be between 1 and 10
    ValidationError:
      description: One invalid property of a request body.
      type: object
      required: [property, message]
      properties:
        property:
          description: The invalid property. An array item uses a zero-based index, for example `tags[2]`.
          type: string
        message:
          type: string

    Email:
      description: An email address.
      type: string
      format: email
      maxLength: 255
      examples: [ana@example.com]
    Password:
      description: |
        A password of 8 to 71 characters.
        Its UTF-8 encoding must be at most 72 bytes.
        A longer password causes `422 Unprocessable Content`.
      type: string
      format: password
      minLength: 8
      maxLength: 71
      examples: [correct-horse-battery]

    User:
      description: |
        The signed in user.
        Only the user of the auth token gets this object.
        Other users see the user as a `Creator`.
      type: object
      required: [id, email, name, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        email:
          $ref: '#/components/schemas/Email'
        name:
          $ref: '#/components/schemas/Name'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: u5n1c8r3t6y0b2e
          email: ana@example.com
          name: Ana
          created: '2024-11-01 08:12:40.517Z'
          updated: '2024-11-01 08:12:40.517Z'
    UserCreate:
      description: The properties of a new user.
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          $ref: '#/components/schemas/Name'
      examples:
        - email: ana@example.com
          password: correct-horse-battery
          name: Ana
    Credentials:
      description: The email and password to sign in.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: The email address of the user.
          type: string
          format: email
        password:
          description: The password of the user.
          type: string
          format: password
      examples:
        - email: ana@example.com
          password: correct-horse-battery
    AuthToken:
      description: An auth token and the user that it belongs to.
      type: object
      required: [token, expires, user]
      properties:
        token:
          description: |
            The auth token.
            Send it in the `Authorization` header as a bearer token.
            Clients must not parse it.
          type: string
          examples: [eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl]
        expires:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/User'
      examples:
        - token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InU1bjFjOHIzdDZ5MGIyZSJ9.c2lnbmF0dXJl
          expires: '2024-11-08 08:12:40.517Z'
          user:
            id: u5n1c8r3t6y0b2e
            email: ana@example.com
            name: Ana
            created: '2024-11-01 08:12:40.517Z'
            updated: '2024-11-01 08:12:40.517Z'
