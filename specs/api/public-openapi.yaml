openapi: 3.1.0
info:
  title: Reviews Public API
  version: 7.0.0
  description: |
    The Public API lets users sign up, sign in, and review restaurants and recipes.

    Sign up and sign in do not require authentication.
    Sign up sends an email with a confirmation link. `confirmEmail` and sign in return an auth token.
    Browsers can keep the token in the `reviews_session` cookie instead. See the `cookie` parameter.
    Read operations do not require authentication.
    Create, update, and delete operations of restaurants, recipes, and reviews require an auth token.
    The place search also requires an auth token.
    A request with an invalid token gets `401 Unauthorized`, also on read operations.

    Timestamps are RFC 3339 in UTC with millisecond precision, for example `2024-11-04T01:26:55.002Z`.

    Request bodies with unknown or read-only properties get `400 Bad Request`.
    Property values that break a schema rule get `422 Unprocessable Content`.
    Each `403 Forbidden` and each `409 Conflict` has a `code` that tells the reason.

    The `/v1` of the path is the name of the API. It does not change with the version of this document.
    The first number of the version changes when a change can break a client.

    - Version 2.0.0 changes the timestamps. Version 1.0.0 had a space in the place of the `T`.
    - Version 2.1.0 adds the `reviews_session` cookie.
    - Version 2.2.0 adds the `cover` of restaurants and the `listRestaurantPhotos` operation.
    - Version 3.0.0 changes `signUp`. It returns `202` without a token, and the user confirms the email address.
      It adds the password reset and the operations of `/users/me`.
      It also adds the lists of restaurants, the approval of new users, and the limits of the write operations.
    - Version 4.0.0 changes `confirmEmail`. It needs the `password` of the sign up.
      It adds the `website`, `phone`, `opening_hours`, and `price_level` of restaurants.
      It also adds a `code` to each `403` and `409` problem. The API now removes the ASCII spaces around names, titles, addresses, and alt texts.
    - Version 5.0.0 allows tags with the letters and digits of all scripts, such as `café`.
      A client that checks the responses against the old `Tag` pattern refuses these tags.
      The API changes tags to Unicode normalization form C.
    - Version 5.1.0 adds `getCurrentUser`. Clients get the signed in user without a new token.
    - Version 5.2.0 adds the `list[eq]` filter of `listRestaurants`.
    - Version 5.3.0 adds the `price_level` filter of `listRestaurants`.
    - Version 5.4.0 adds the recipes, their reviews, and their photos. `Reviewer` gets the counts and the average of the recipe reviews.
    - Version 5.5.0 adds the recipes of lists, `favorite` of recipes, and `recipe_count` and `has_recipe` of lists.
    - Version 6.0.0 puts `restaurant` in the names of the restaurant reviews, so they match the recipe reviews.
      `/reviews` is now `/restaurant-reviews`, and `createReview` is now `createRestaurantReview`.
      The reviews of a user are at `/reviewers/{reviewerId}/restaurant-reviews`.
      `review_count` and `average_overall` of `Reviewer` and `item_count` of lists also get `restaurant` in their names.
      A list of recipes has no `ingredients` and no `steps`. `getRecipe` has them.
      The `source` of a recipe with reviews of other users cannot change.
    - Version 7.0.0 allows many reviews of one user for one restaurant or recipe. A review is one visit or one cook.
      Each review has a required `date`. The review lists sort by `-date` by default.
      The `review_exists` code is gone.
      Restaurants and recipes have the `own_review_count` of the user of the token.

servers:
  - url: /v1

tags:
  - name: users
    description: |
      Sign up, sign in, sign out, and refresh the auth token of a user.
      A user can also reset the password and change or delete the account.
  - name: restaurants
    description: Restaurants and their reviews.
  - name: recipes
    description: Recipes and their reviews.
  - name: reviewers
    description: The public profiles of users and their reviews.
  - name: places
    description: The search for the place of a restaurant.
  - name: lists
    description: The lists of restaurants and recipes of users. Each user has a favorites list.

paths:
  /users:
    post:
      operationId: signUp
      x-rate-limit:
        key: ip
        name: sign-in
      summary: Sign up a user
      description: |
        Creates a user and sends an email with a confirmation link to the email address.
        `confirmEmail` then signs the user in with the token of the link and this `password`. The user cannot sign in before that.
        The response is the same for a new email address and for an email address that a user has.
        An email address of a confirmed user gets an email that tells about the account. The user does not change.
        An email address of a user without confirmation gets a new link. The user then has the new `name` and `password`.
        At the email limit of the address, this user does not change.
        The API sends only a small number of emails to one address in one hour. The response does not show it.
        The new user is not approved. A superuser approves the user in the PocketBase dashboard.
        Until then, the user can sign in, sign out, read, and change or delete the account.
        The API ignores the `Authorization` header and the `reviews_session` cookie on this operation.
      tags: [users]
      security:
        - {}
      requestBody:
        description: The new user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '202':
          description: The API sends an email to the email address.
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/confirmations:
    post:
      operationId: confirmEmail
      x-rate-limit:
        key: ip
        name: sign-in
      summary: Confirm the email address of a user
      description: |
        Confirms the email address with the token of the confirmation link and signs the user in.
        A token works one time and for one day.
        The request also needs the `password` of the user. A link alone does not confirm a user.
        A person who does not own the address then cannot set the password of a confirmed user.
        A wrong `password` causes `422`. The token stays valid.
        Too many wrong passwords for one user cause `429` with the `code` `wrong_password_limit`.
        This count is not the count of sign in. Only a request with a valid token adds to it.
        The API ignores the `Authorization` header and the `reviews_session` cookie on this operation.
      tags: [users]
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        description: The token of the confirmation link and the password of the user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmation'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The email address is confirmed and the user is signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/password-resets:
    post:
      operationId: requestPasswordReset
      x-rate-limit:
        key: ip
        name: sign-in
      summary: Send a password reset link
      description: |
        Sends an email with a password reset link to the email address of a user.
        The response is the same for all email addresses.
        The API sends only a small number of emails to one address in one hour. The response does not show it.
        The API ignores the `Authorization` header and the `reviews_session` cookie on this operation.
      tags: [users]
      security:
        - {}
      requestBody:
        description: The email address of the user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '202':
          description: The API sends an email if a user has the email address.
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/password:
    put:
      operationId: resetPassword
      x-rate-limit:
        key: ip
        name: sign-in
      summary: Set a new password with a reset token
      description: |
        Sets the password of the user of the token of a password reset link.
        A token works one time and for 30 minutes.
        All auth tokens of the user become invalid. The user then signs in with the new password.
        The reset also confirms the email address of the user.
        The API ignores the `Authorization` header and the `reviews_session` cookie on this operation.
      tags: [users]
      security:
        - {}
      requestBody:
        description: The token of the reset link and the new password.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The user has the new password.
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/me:
    get:
      operationId: getCurrentUser
      x-allow-unapproved: true
      summary: Get the signed in user
      description: |
        Returns the user of the auth token.
        Clients use this operation to check a stored token. It makes no new token.
        A user who is not approved also gets the user.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The signed in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateUser
      x-allow-unapproved: true
      x-rate-limit:
        key: user
        name: edit
      summary: Change the name of the user
      description: Changes the user of the auth token.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The user properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/me/password:
    put:
      operationId: changePassword
      x-allow-unapproved: true
      x-rate-limit:
        key: user
        name: edit
      summary: Change the password of the user
      description: |
        Changes the password of the user of the auth token.
        All auth tokens of the user become invalid, also on other devices. The response has a new auth token.
        A wrong `current_password` causes `422`. It counts for the wrong password limit of sign in.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        description: The current password and the new password.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The user has the new password. The body has a new auth token.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/me/deletion:
    post:
      operationId: deleteUser
      x-allow-unapproved: true
      x-rate-limit:
        key: user
        name: edit
      summary: Delete the user
      description: |
        Deletes the user of the auth token. The delete cannot be undone.
        The reviews, the photos, and the lists of the user are deleted also.
        The restaurants of the user stay. They then have no creator.
        A wrong `password` causes `422`. It counts for the wrong password limit of sign in.
        A request with the `reviews_session` cookie also deletes the cookie.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The password of the user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDelete'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The user was deleted.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/DeleteSessionCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/tokens:
    post:
      operationId: signIn
      x-rate-limit:
        key: ip
        name: sign-in
      summary: Sign in a user with email and password
      description: |
        The API ignores the `Authorization` header and the `reviews_session` cookie on this operation.
        Too many wrong passwords for one email address cause `429 Too Many Requests` for this address.
        A correct password then also gets `429` until the time of `Retry-After`.
        The limit counts an email address without a user in the same way. The `429` does not show if a user has the address.
        A user who did not confirm the email address gets `403` for the correct password.
        The API then sends a new confirmation link.
      tags: [users]
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        description: The email and password of the user.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The user signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/EmailNotConfirmed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: signOut
      x-allow-unapproved: true
      summary: Sign out a user on all devices
      description: |
        Makes all auth tokens of the user of the current token invalid.
        This includes the current token and the tokens of other devices.
        A request with the `reviews_session` cookie also deletes the cookie.
        The operation has no rate limit. A user can always sign out.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: All auth tokens of the user are invalid.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/DeleteSessionCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/tokens/refresh:
    post:
      operationId: refreshToken
      x-allow-unapproved: true
      summary: Refresh the auth token of a user
      description: |
        Returns a new auth token for the user of the current token.
        The current token must be valid and not expired.
        To check a stored token without a new token, use `getCurrentUser`.
        A request with the `reviews_session` cookie gets a new cookie, also without `cookie=true`.
        A bearer token and `cookie=true` move the token into the cookie.
        The operation has no rate limit. It changes no data.
      tags: [users]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The new auth token and the user.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants:
    post:
      operationId: createRestaurant
      x-rate-limit:
        key: user
        name: create
      summary: Create a restaurant
      description: |
        A restaurant needs a `location`.
        A `location.place_id` that another restaurant has causes `409 Conflict`.
        The problem then has the ID of that restaurant in `restaurant`.
      tags: [restaurants]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The restaurant to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The restaurant was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listRestaurants
      summary: List restaurants
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RestaurantSort'
        - $ref: '#/components/parameters/RestaurantSearch'
        - $ref: '#/components/parameters/OverallFilter'
        - $ref: '#/components/parameters/PriceLevelFilter'
        - $ref: '#/components/parameters/NearFilter'
        - $ref: '#/components/parameters/WithinFilter'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedFilter'
        - $ref: '#/components/parameters/UpdatedFilter'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
        - $ref: '#/components/parameters/ListEq'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of restaurants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      operationId: getRestaurant
      summary: Get a restaurant
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRestaurant
      x-rate-limit:
        key: user
        name: edit
      summary: Update a restaurant
      description: |
        Only the creator of the restaurant can update it.
        A restaurant without a creator can be updated by each user who has a review of it.
        `name` can change only while no other user has a review of the restaurant.
        A stored `location` has the same rule. A restaurant without a location can always get one.
        A value that is equal to the stored value is not a change.
        A `location.place_id` that another restaurant has causes `409 Conflict`.
        The problem then has the ID of that restaurant in `restaurant`.
      tags: [restaurants]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The restaurant properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RestaurantPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteRestaurant
      x-rate-limit:
        key: user
        name: edit
      summary: Delete a restaurant
      description: |
        Only the creator of the restaurant can delete it.
        A restaurant without a creator can be deleted by each user who has a review of it.
        A restaurant that has a review of another user cannot be deleted.
        The review of the user is deleted with the restaurant.
      tags: [restaurants]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The restaurant was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /restaurants/{restaurantId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      operationId: createRestaurantReview
      x-rate-limit:
        key: user
        name: create
      summary: Create a review for a restaurant
      description: A review is one visit. A user can write many reviews of one restaurant.
      tags: [restaurants]
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        description: The review to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantReviewCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The review was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: listRestaurantReviews
      summary: List the reviews of a restaurant
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
