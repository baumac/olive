openapi: 3.1.0
info:
  title: Reviews Public API
  version: 1.0.0
  description: |
    The Public API lets users review restaurants.

    Read operations do not require authentication.
    Create, update, and delete operations require a PocketBase auth token for a record in the `users` collection.
    A request with an invalid token gets `401 Unauthorized`, also on read operations.

    Timestamps use the PocketBase format, for example `2024-11-04 01:26:55.002Z`.
    This format is not RFC 3339.

    Request bodies with unknown or read-only properties get `400 Bad Request`.
    Property values that break a schema rule get `422 Unprocessable Content`.

servers:
  - url: /v1

tags:
  - name: restaurants
    description: Restaurants that can be reviewed.
  - name: reviews
    description: Scores and feedback for a single restaurant.

paths:
  /restaurants:
    post:
      operationId: createRestaurant
      summary: Create a restaurant
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The restaurant to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The restaurant was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listRestaurants
      summary: List restaurants
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RestaurantSort'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedLt'
        - $ref: '#/components/parameters/CreatedLte'
        - $ref: '#/components/parameters/CreatedEq'
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedGt'
        - $ref: '#/components/parameters/UpdatedLt'
        - $ref: '#/components/parameters/UpdatedLte'
        - $ref: '#/components/parameters/UpdatedEq'
        - $ref: '#/components/parameters/UpdatedGte'
        - $ref: '#/components/parameters/UpdatedGt'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of restaurants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      operationId: getRestaurant
      summary: Get a restaurant
      tags: [restaurants]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRestaurant
      summary: Update a restaurant
      description: |
        Only the creator of the restaurant can update it.
        `name` can change only while the restaurant has no reviews.
        A value that is equal to the stored value is not a change.
      tags: [restaurants]
      security:
        - bearerAuth: []
      requestBody:
        description: The restaurant properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RestaurantPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteRestaurant
      summary: Delete a restaurant
      description: |
        Only the creator of the restaurant can delete it.
        A restaurant that has reviews cannot be deleted.
      tags: [restaurants]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The restaurant was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /restaurants/{restaurantId}/reviews:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      operationId: createReview
      summary: Create a review for a restaurant
      description: A user can have at most one review per restaurant.
      tags: [reviews]
      security:
        - bearerAuth: []
      requestBody:
        description: The review to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '201':
          description: The review was created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    get:
      operationId: listReviews
      summary: List the reviews of a restaurant
      tags: [reviews]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ReviewSort'
        - $ref: '#/components/parameters/KindEq'
        - $ref: '#/components/parameters/KindIn'
        - $ref: '#/components/parameters/RatingLt'
        - $ref: '#/components/parameters/RatingLte'
        - $ref: '#/components/parameters/RatingEq'
        - $ref: '#/components/parameters/RatingGte'
        - $ref: '#/components/parameters/RatingGt'
        - $ref: '#/components/parameters/SpaceLt'
        - $ref: '#/components/parameters/SpaceLte'
        - $ref: '#/components/parameters/SpaceEq'
        - $ref: '#/components/parameters/SpaceGte'
        - $ref: '#/components/parameters/SpaceGt'
        - $ref: '#/components/parameters/ServiceLt'
        - $ref: '#/components/parameters/ServiceLte'
        - $ref: '#/components/parameters/ServiceEq'
        - $ref: '#/components/parameters/ServiceGte'
        - $ref: '#/components/parameters/ServiceGt'
        - $ref: '#/components/parameters/FoodLt'
        - $ref: '#/components/parameters/FoodLte'
        - $ref: '#/components/parameters/FoodEq'
        - $ref: '#/components/parameters/FoodGte'
        - $ref: '#/components/parameters/FoodGt'
        - $ref: '#/components/parameters/PriceLt'
        - $ref: '#/components/parameters/PriceLte'
        - $ref: '#/components/parameters/PriceEq'
        - $ref: '#/components/parameters/PriceGte'
        - $ref: '#/components/parameters/PriceGt'
        - $ref: '#/components/parameters/TagsHas'
        - $ref: '#/components/parameters/TagsHasAny'
        - $ref: '#/components/parameters/TagsHasAll'
        - $ref: '#/components/parameters/CreatedLt'
        - $ref: '#/components/parameters/CreatedLte'
        - $ref: '#/components/parameters/CreatedEq'
        - $ref: '#/components/parameters/CreatedGte'
        - $ref: '#/components/parameters/CreatedGt'
        - $ref: '#/components/parameters/UpdatedLt'
        - $ref: '#/components/parameters/UpdatedLte'
        - $ref: '#/components/parameters/UpdatedEq'
        - $ref: '#/components/parameters/UpdatedGte'
        - $ref: '#/components/parameters/UpdatedGt'
        - $ref: '#/components/parameters/CreatorEq'
        - $ref: '#/components/parameters/CreatorIn'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: A page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /restaurants/{restaurantId}/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ReviewId'
    get:
      operationId: getReview
      summary: Get a review
      tags: [reviews]
      security:
        - {}
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateReview
      summary: Update a review
      description: |
        Only the creator of the review can update it.
        The body must contain the stored `kind`.
        A different `kind` causes `422 Unprocessable Content`.
      tags: [reviews]
      security:
        - bearerAuth: []
      requestBody:
        description: The review properties to change.
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ReviewPatch'
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '200':
          description: The updated review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      operationId: deleteReview
      summary: Delete a review
      description: Only the creator of the review can delete it.
      tags: [reviews]
      security:
        - bearerAuth: []
      responses:
        default:
          $ref: '#/components/responses/UnexpectedError'
        '204':
          description: The review was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A PocketBase auth token for a record in the `users` collection.

  headers:
    Location:
      description: The URL of the created resource.
      schema:
        type: string
        format: uri-reference

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      description: The ID of the restaurant.
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'
    ReviewId:
      name: reviewId
      in: path
      description: The ID of the review.
      required: true
      schema:
        $ref: '#/components/schemas/RecordId'

    Limit:
      name: limit
      in: query
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: |
        The `next_cursor` value of the previous page.
        Clients must not parse or build cursor values.
        A cursor is valid only with the same filters and sort that made it.
      schema:
        type: string
        minLength: 1

    RestaurantSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `name` sort ignores case only for the ASCII letters `A` to `Z`.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(name|created|updated)(,-?(name|created|updated))*$'
        default: '-created'
      example: 'name,-created'
    ReviewSort:
      name: sort
      in: query
      description: |
        A comma-separated list of properties.
        A `-` prefix sorts a property in descending order.
        Each property can occur only one time. A repeated property causes `400 Bad Request`.
        The `title` sort ignores case only for the ASCII letters `A` to `Z`.
        A sort on a kind-specific property puts reviews of other kinds last in both directions.
        The API always adds `id` as the last sort key.
      schema:
        type: string
        pattern: '^-?(rating|space|service|food|price|title|created|updated)(,-?(rating|space|service|food|price|title|created|updated))*$'
        default: '-created'
      example: '-rating,title'

    KindEq:
      name: kind[eq]
      in: query
      description: The review `kind` is equal to the value.
      schema:
        type: string
    KindIn:
      name: kind[in]
      in: query
      description: The review `kind` is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
        examples: [[basic, joc_de_cartes]]

    TagsHas:
      name: tags[has]
      in: query
      description: The `tags` contain the tag.
      schema:
        $ref: '#/components/schemas/Tag'
    TagsHasAny:
      name: tags[has_any]
      in: query
      description: The `tags` contain at least one of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/Tag'
        examples: [[italian, pasta]]
    TagsHasAll:
      name: tags[has_all]
      in: query
      description: The `tags` contain all of the tags.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/Tag'
        examples: [[italian, pasta]]

    RatingLt:
      name: rating[lt]
      in: query
      description: Matches only `basic` reviews.
      schema:
        $ref: '#/components/schemas/Rating'
    RatingLte:
      name: rating[lte]
      in: query
      description: Matches only `basic` reviews.
      schema:
        $ref: '#/components/schemas/Rating'
    RatingEq:
      name: rating[eq]
      in: query
      description: Matches only `basic` reviews.
      schema:
        $ref: '#/components/schemas/Rating'
    RatingGte:
      name: rating[gte]
      in: query
      description: Matches only `basic` reviews.
      schema:
        $ref: '#/components/schemas/Rating'
    RatingGt:
      name: rating[gt]
      in: query
      description: Matches only `basic` reviews.
      schema:
        $ref: '#/components/schemas/Rating'

    SpaceLt:
      name: space[lt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    SpaceLte:
      name: space[lte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    SpaceEq:
      name: space[eq]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    SpaceGte:
      name: space[gte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    SpaceGt:
      name: space[gt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'

    ServiceLt:
      name: service[lt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    ServiceLte:
      name: service[lte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    ServiceEq:
      name: service[eq]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    ServiceGte:
      name: service[gte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    ServiceGt:
      name: service[gt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'

    FoodLt:
      name: food[lt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    FoodLte:
      name: food[lte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    FoodEq:
      name: food[eq]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    FoodGte:
      name: food[gte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    FoodGt:
      name: food[gt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'

    PriceLt:
      name: price[lt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    PriceLte:
      name: price[lte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    PriceEq:
      name: price[eq]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    PriceGte:
      name: price[gte]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'
    PriceGt:
      name: price[gt]
      in: query
      description: Matches only `joc_de_cartes` reviews.
      schema:
        $ref: '#/components/schemas/JocDeCartesScore'

    CreatedLt:
      name: created[lt]
      in: query
      description: The `created` timestamp is before the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedLte:
      name: created[lte]
      in: query
      description: The `created` timestamp is at or before the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedEq:
      name: created[eq]
      in: query
      description: The `created` timestamp is at the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedGte:
      name: created[gte]
      in: query
      description: The `created` timestamp is at or after the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    CreatedGt:
      name: created[gt]
      in: query
      description: The `created` timestamp is after the value.
      schema:
        $ref: '#/components/schemas/Timestamp'

    UpdatedLt:
      name: updated[lt]
      in: query
      description: The `updated` timestamp is before the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedLte:
      name: updated[lte]
      in: query
      description: The `updated` timestamp is at or before the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedEq:
      name: updated[eq]
      in: query
      description: The `updated` timestamp is at the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedGte:
      name: updated[gte]
      in: query
      description: The `updated` timestamp is at or after the value.
      schema:
        $ref: '#/components/schemas/Timestamp'
    UpdatedGt:
      name: updated[gt]
      in: query
      description: The `updated` timestamp is after the value.
      schema:
        $ref: '#/components/schemas/Timestamp'

    CreatorEq:
      name: creator[eq]
      in: query
      description: The `creator.id` is equal to the value.
      schema:
        $ref: '#/components/schemas/RecordId'
    CreatorIn:
      name: creator[in]
      in: query
      description: The `creator.id` is equal to any of the values.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RecordId'
        examples: [[u5n1c8r3t6y0b2e, u2g6k0m4o8q1s5w]]

  responses:
    BadRequest:
      description: |
        The request is malformed, has invalid query parameters, or has unknown or read-only properties in the body.
        A property of a different review kind is an unknown property.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The bearer token is missing on a create, update, or delete request, or the bearer token is invalid.
      headers:
        WWW-Authenticate:
          description: The auth scheme. An invalid token adds `error="invalid_token"`.
          required: true
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The user is not the creator of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource or the restaurant in the path does not exist, or the review belongs to a different restaurant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The request conflicts with the current state.
        Examples are a duplicate review for a restaurant, a delete of a restaurant that has reviews,
        or a change of `name` on a restaurant that has reviews.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request content type is wrong.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request body has invalid property values, or it changes the `kind` of a review.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnexpectedError:
      description: An error that no other response describes, such as `500 Internal Server Error`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    RecordId:
      description: A PocketBase record ID.
      type: string
      pattern: '^[a-z0-9]{15}$'
      examples: [k3x9m2p7q1w8z4a]
    Timestamp:
      description: A UTC timestamp in the PocketBase format. This format is not RFC 3339.
      type: string
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}Z$'
      examples: ['2024-11-04 01:26:55.002Z']
    Name:
      description: A name with at least one character that is not ASCII whitespace.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[^\t\n\v\f\r ]'
    Title:
      description: A title with at least one character that is not ASCII whitespace.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '[^\t\n\v\f\r ]'
    LongText:
      description: A text of at most 10,000 characters.
      type: string
      maxLength: 10000
    Rating:
      description: The overall score of a `basic` review.
      type: integer
      minimum: 1
      maximum: 5
    JocDeCartesScore:
      description: The score of one category of a `joc_de_cartes` review.
      type: integer
      minimum: 1
      maximum: 10
    Tag:
      description: A lowercase tag. Words are separated by single hyphens.
      type: string
      minLength: 1
      maxLength: 63
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    Tags:
      description: Unique tags.
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Tag'
      examples: [[italian, pasta]]
    Creator:
      description: The public fields of a user.
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          description: The name of the user. It can be an empty string.
          type: string

    Restaurant:
      description: A restaurant that can be reviewed.
      type: object
      required: [id, name, creator, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          description: The user who created the restaurant. It is `null` after that user is deleted.
          oneOf:
            - $ref: '#/components/schemas/Creator'
            - type: 'null'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - id: k3x9m2p7q1w8z4a
          name: Luigi's Trattoria
          description: A family-run Italian restaurant
          tags: [italian, pasta]
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
          created: '2024-11-04 01:26:55.002Z'
          updated: '2024-11-04 01:26:55.002Z'
    RestaurantCreate:
      description: The properties of a new restaurant.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
      examples:
        - name: Luigi's Trattoria
          description: A family-run Italian restaurant
          tags: [italian, pasta]
    RestaurantPatch:
      description: A JSON Merge Patch. `null` clears an optional property.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
      examples:
        - description: A family-run Italian restaurant since 1987
          tags: null
    RestaurantList:
      description: A page of restaurants.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: k3x9m2p7q1w8z4a
              name: Luigi's Trattoria
              description: A family-run Italian restaurant
              tags: [italian, pasta]
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
              created: '2024-11-04 01:26:55.002Z'
              updated: '2024-11-04 01:26:55.002Z'
          next_cursor: c2Fk9xQe7LmT2vBn

    Review:
      description: |
        A review of a restaurant. `kind` selects the score properties.
        Later releases of `/v1` can add kinds.
        Clients must handle unknown kinds without failing.
      oneOf:
        - $ref: '#/components/schemas/BasicReview'
        - $ref: '#/components/schemas/JocDeCartesReview'
      discriminator:
        propertyName: kind
        mapping:
          basic: '#/components/schemas/BasicReview'
          joc_de_cartes: '#/components/schemas/JocDeCartesReview'
      examples:
        - id: r7d4f0h2j9l5s3v
          restaurant: k3x9m2p7q1w8z4a
          kind: basic
          rating: 5
          title: Best carbonara in town
          feedback: Friendly staff and great pasta
          tags: [favorites]
          creator:
            id: u2g6k0m4o8q1s5w
            name: Joe
          created: '2024-11-04 01:38:00.431Z'
          updated: '2024-11-05 09:12:00.000Z'
    ReviewBase:
      description: The properties that all review kinds have.
      type: object
      required: [id, restaurant, kind, title, creator, created, updated]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        restaurant:
          $ref: '#/components/schemas/RecordId'
        kind:
          type: string
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
        creator:
          $ref: '#/components/schemas/Creator'
        created:
          $ref: '#/components/schemas/Timestamp'
        updated:
          $ref: '#/components/schemas/Timestamp'
    BasicReview:
      description: A review with one overall score.
      allOf:
        - $ref: '#/components/schemas/ReviewBase'
        - type: object
          required: [kind, rating]
          properties:
            kind:
              const: basic
            rating:
              $ref: '#/components/schemas/Rating'
      examples:
        - id: r7d4f0h2j9l5s3v
          restaurant: k3x9m2p7q1w8z4a
          kind: basic
          rating: 5
          title: Best carbonara in town
          feedback: Friendly staff and great pasta
          tags: [favorites]
          creator:
            id: u2g6k0m4o8q1s5w
            name: Joe
          created: '2024-11-04 01:38:00.431Z'
          updated: '2024-11-05 09:12:00.000Z'
    JocDeCartesReview:
      description: A review that scores the space, service, food, and price.
      allOf:
        - $ref: '#/components/schemas/ReviewBase'
        - type: object
          required: [kind, space, service, food, price]
          properties:
            kind:
              const: joc_de_cartes
            space:
              $ref: '#/components/schemas/SpaceScore'
            service:
              $ref: '#/components/schemas/ServiceScore'
            food:
              $ref: '#/components/schemas/FoodScore'
            price:
              $ref: '#/components/schemas/PriceScore'
      examples:
        - id: r1b8c5e2g9i6k3m
          restaurant: k3x9m2p7q1w8z4a
          kind: joc_de_cartes
          space: 7
          service: 9
          food: 8
          price: 6
          title: Great food, a bit expensive
          tags: [date-night]
          creator:
            id: u5n1c8r3t6y0b2e
            name: Ana
          created: '2024-11-06 19:02:11.120Z'
          updated: '2024-11-06 19:02:11.120Z'
    SpaceScore:
      description: Decoration, cleanliness, comfort, atmosphere, and kitchen setup.
      $ref: '#/components/schemas/JocDeCartesScore'
    ServiceScore:
      description: Professionalism, speed, friendliness, and attentiveness of the waitstaff.
      $ref: '#/components/schemas/JocDeCartesScore'
    FoodScore:
      description: Presentation, flavor, ingredient quality, and culinary execution.
      $ref: '#/components/schemas/JocDeCartesScore'
    PriceScore:
      description: Value for money, and whether the final bill matches the quality provided.
      $ref: '#/components/schemas/JocDeCartesScore'

    ReviewCreate:
      description: The properties of a new review. `kind` selects the score properties.
      oneOf:
        - $ref: '#/components/schemas/BasicReviewCreate'
        - $ref: '#/components/schemas/JocDeCartesReviewCreate'
      discriminator:
        propertyName: kind
        mapping:
          basic: '#/components/schemas/BasicReviewCreate'
          joc_de_cartes: '#/components/schemas/JocDeCartesReviewCreate'
      examples:
        - kind: basic
          rating: 5
          title: Best carbonara in town
        - kind: joc_de_cartes
          space: 7
          service: 9
          food: 8
          price: 6
          title: Great food, a bit expensive
    BasicReviewCreate:
      description: The properties of a new `basic` review.
      type: object
      additionalProperties: false
      required: [kind, rating, title]
      properties:
        kind:
          const: basic
        rating:
          $ref: '#/components/schemas/Rating'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'
    JocDeCartesReviewCreate:
      description: The properties of a new `joc_de_cartes` review.
      type: object
      additionalProperties: false
      required: [kind, space, service, food, price, title]
      properties:
        kind:
          const: joc_de_cartes
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          $ref: '#/components/schemas/LongText'
        tags:
          $ref: '#/components/schemas/Tags'

    ReviewPatch:
      description: |
        A JSON Merge Patch. `null` clears an optional property.
        `kind` must be equal to the stored kind.
      oneOf:
        - $ref: '#/components/schemas/BasicReviewPatch'
        - $ref: '#/components/schemas/JocDeCartesReviewPatch'
      discriminator:
        propertyName: kind
        mapping:
          basic: '#/components/schemas/BasicReviewPatch'
          joc_de_cartes: '#/components/schemas/JocDeCartesReviewPatch'
      examples:
        - kind: basic
          rating: 4
          feedback: null
        - kind: joc_de_cartes
          price: 7
    BasicReviewPatch:
      description: A JSON Merge Patch for a `basic` review.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: basic
        rating:
          $ref: '#/components/schemas/Rating'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'
    JocDeCartesReviewPatch:
      description: A JSON Merge Patch for a `joc_de_cartes` review.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: joc_de_cartes
        space:
          $ref: '#/components/schemas/SpaceScore'
        service:
          $ref: '#/components/schemas/ServiceScore'
        food:
          $ref: '#/components/schemas/FoodScore'
        price:
          $ref: '#/components/schemas/PriceScore'
        title:
          $ref: '#/components/schemas/Title'
        feedback:
          oneOf:
            - $ref: '#/components/schemas/LongText'
            - type: 'null'
        tags:
          oneOf:
            - $ref: '#/components/schemas/Tags'
            - type: 'null'

    ReviewList:
      description: A page of reviews. It can contain reviews of all kinds.
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
      examples:
        - items:
            - id: r7d4f0h2j9l5s3v
              restaurant: k3x9m2p7q1w8z4a
              kind: basic
              rating: 5
              title: Best carbonara in town
              creator:
                id: u2g6k0m4o8q1s5w
                name: Joe
              created: '2024-11-04 01:38:00.431Z'
              updated: '2024-11-05 09:12:00.000Z'
            - id: r1b8c5e2g9i6k3m
              restaurant: k3x9m2p7q1w8z4a
              kind: joc_de_cartes
              space: 7
              service: 9
              food: 8
              price: 6
              title: Great food, a bit expensive
              creator:
                id: u5n1c8r3t6y0b2e
                name: Ana
              created: '2024-11-06 19:02:11.120Z'
              updated: '2024-11-06 19:02:11.120Z'
          next_cursor: null

    NextCursor:
      description: The cursor for the next page. It is `null` on the last page.
      oneOf:
        - type: string
        - type: 'null'

    Problem:
      description: An RFC 9457 Problem Details object.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: The invalid properties. Only validation errors have this property.
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      examples:
        - type: about:blank
          title: Unprocessable Content
          status: 422
          detail: The request body has invalid properties.
          errors:
            - property: rating
              message: must be between 1 and 5
    ValidationError:
      description: One invalid property of a request body.
      type: object
      required: [property, message]
      properties:
        property:
          description: The invalid property. An array item uses a zero-based index, for example `tags[2]`.
          type: string
        message:
          type: string
